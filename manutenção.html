<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Site em Manutenção</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                font-family: "Arial", sans-serif;
                background: linear-gradient(-45deg, #273f87, #3b5998, #1e2a5e, #273f87);
                background-size: 400% 400%;
                animation: gradientShift 15s ease infinite;
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                overflow: hidden;
            }

            @keyframes gradientShift {
                0% {
                    background-position: 0% 50%;
                }
                50% {
                    background-position: 100% 50%;
                }
                100% {
                    background-position: 0% 50%;
                }
            }

            .container {
                text-align: center;
                color: white;
                z-index: 10;
                position: relative;
                max-width: 600px;
                padding: 2rem;
            }

            .maintenance-icon {
                font-size: 6rem;
                margin-bottom: 2rem;
                animation: bounce 2s ease-in-out infinite;
                display: inline-block;
            }

            @keyframes bounce {
                0%,
                20%,
                50%,
                80%,
                100% {
                    transform: translateY(0);
                }
                40% {
                    transform: translateY(-20px);
                }
                60% {
                    transform: translateY(-10px);
                }
            }

            h1 {
                font-size: 3rem;
                margin-bottom: 1rem;
                font-weight: 300;
                letter-spacing: 2px;
                animation: fadeInUp 1s ease-out;
            }

            p {
                font-size: 1.2rem;
                margin-bottom: 2rem;
                opacity: 0.9;
                line-height: 1.6;
                animation: fadeInUp 1s ease-out 0.3s both;
            }

            .progress-container {
                display: flex;
                justify-content: center;
                margin-bottom: 1.2rem;
                animation: fadeInUp 1s ease-out 0.6s both;
            }

            .loading-image {
                width: 80px;
                height: 80px;
                animation: spin 5s linear infinite;
            }

            .loading-image img {
                width: 100%;
                height: 100%;
            }

            @keyframes spin {
                0% {
                    transform: rotate(0deg);
                }
                100% {
                    transform: rotate(360deg);
                }
            }

            @keyframes fadeInUp {
                from {
                    opacity: 0;
                    transform: translateY(30px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            .contact-info {
                margin-top: 2rem;
                animation: fadeInUp 1s ease-out 0.9s both;
            }

            .contact-info a {
                color: rgba(255, 255, 255, 0.8);
                text-decoration: none;
                transition: color 0.3s ease;
            }

            .contact-info a:hover {
                color: white;
            }

            /* Elementos flutuantes decorativos */
            .floating-elements {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                pointer-events: none;
                z-index: 1;
            }

            .floating-element {
                position: absolute;
                width: 10px;
                height: 10px;
                background: rgba(39, 63, 135, 0.2);
                border-radius: 50%;
                animation: float 6s ease-in-out infinite;
                /* background-color: lime; */
            }

            .floating-element:nth-child(1) {
                top: 20%;
                left: 10%;
                animation-delay: 0s;
                animation-duration: 6s;
            }

            .floating-element:nth-child(2) {
                top: 60%;
                left: 80%;
                animation-delay: 2s;
                animation-duration: 8s;
            }

            .floating-element:nth-child(3) {
                top: 80%;
                left: 20%;
                animation-delay: 4s;
                animation-duration: 7s;
            }

            .floating-element:nth-child(4) {
                top: 30%;
                left: 70%;
                animation-delay: 1s;
                animation-duration: 9s;
            }

            .floating-element:nth-child(5) {
                top: 10%;
                left: 50%;
                animation-delay: 3s;
                animation-duration: 5s;
            }

            @keyframes float {
                0%,
                100% {
                    transform: translateY(0px) rotate(0deg);
                    opacity: 0.4;
                }
                50% {
                    transform: translateY(-20px) rotate(180deg);
                    opacity: 0.8;
                }
            }

            .glass-card {
                background: rgba(255, 255, 255, 0.1);
                backdrop-filter: blur(10px);
                border-radius: 20px;
                padding: 3rem;
                border: 1px solid rgba(255, 255, 255, 0.2);
                box-shadow: 0 8px 32px rgba(39, 63, 135, 0.2);
            }

            @media (max-width: 768px) {
                .container {
                    padding: 1rem;
                }

                h1 {
                    font-size: 2rem;
                }

                .maintenance-icon {
                    font-size: 4rem;
                }

                p {
                    font-size: 1rem;
                }

                .glass-card {
                    padding: 2rem;
                }
            }
        </style>
    </head>
    <body>
        <div class="floating-elements">
            <div class="floating-element"></div>
            <div class="floating-element"></div>
            <div class="floating-element"></div>
            <div class="floating-element"></div>
            <div class="floating-element"></div>
        </div>

        <div class="container">
            <div class="glass-card">
                <div class="progress-container">
                    <div class="loading-image">
                        <img
                            src="assets/img/Default_A_modern_minimalistic_gear_icon_cogwheel_symmetrical_a_1_15d98815-551e-4f61-9575-57f06dec7e33_0.png"
                            alt="Carregando..."
                        />
                    </div>
                </div>
                <!-- <div class="maintenance-icon">🔧</div>
                <h1>Site em Manutenção</h1> -->
                <p>
                    Estamos trabalhando para melhorar sua experiência, trazendo atualizações
                    importantes no sistema.
                </p>


                <p>Previsão de retorno: em breve</p>

                <!-- <div class="contact-info">
                    <p>Em caso de urgência, entre em contato:</p>
                    <p><a href="mailto:contato@seusite.com">contato@seusite.com</a></p>
                </div> -->
            </div>
        </div>

        <script>
            // Adiciona interatividade extra
            document.addEventListener("mousemove", (e) => {
                const floatingElements = document.querySelectorAll(".floating-element");
                const mouseX = e.clientX / window.innerWidth;
                const mouseY = e.clientY / window.innerHeight;

                floatingElements.forEach((el, index) => {
                    const speed = (index + 1) * 0.02;
                    const x = mouseX * speed * 50;
                    const y = mouseY * speed * 50;

                    el.style.transform += ` translate(${x}px, ${y}px)`;
                });
            });
        </script>
    </body>
</html>
