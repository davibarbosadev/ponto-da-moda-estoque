<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0" />
            <link rel="stylesheet" href="../css/style.css" />
            <script
                type="module"
                src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"
            ></script>
            <script
                nomodule
                src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"
            ></script>
            <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
            <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
            <script src="js/load-components.js"></script>
            <script defer src="js/btn-mobile.js"></script>
            <script defer src="js/extract-reference.js"></script>
            <script defer src="js/formate-product.js"></script>
            <!-- <script defer src="js/description-product.js"></script> -->
            <title>Ponto da Moda - Estoque</title>
        </head>
    </head>
    <body>
        <header id="header" class="header"></header>
        <div class="main-container">
            <aside id="sidebar" class="sidebar"></aside>

            <main class="main">
                <div class="form-container">
                    <h2 class="heading-primary">Descrição de Produto - (Automático)</h2>

                    <h3 class="heading-secondary">Passo 1 - Extrair Referência</h3>
                    <form class="form form--extract-reference">
                        <div class="form__group">
                            <textarea
                                id="csvInput"
                                placeholder='Cole aqui seus dados CSV no formato:
"codigo";"descrição"
"ES07";"CF000480MISCL1M - PRODUTO..."'
                            ></textarea>
                        </div>
                        <button class="btn btn--submit">Processar e Copiar</button>
                    </form>

                    <h3 class="heading-secondary">Passo 2 - Formatar Descrição</h3>
                    <form class="form form--formate-product-descriptiom">
                        <div class="form__group">
                            <textarea
                                id="csvInput"
                                placeholder='Cole aqui seus dados CSV  no formato:
"referência - descrição";"preço"
"CF000480MISCL1G - DESCRIÇÃO DO PRODUTO";"79,99"'
                            ></textarea>
                        </div>
                        <button class="btn btn--submit">Formatar e Copiar</button>
                    </form>
                </div>

                <div class="description-list"></div>
                <iframe id="iframeContent" style="display: none; width: 0; height: 0"></iframe>
            </main>
        </div>
    </body>
</html>
