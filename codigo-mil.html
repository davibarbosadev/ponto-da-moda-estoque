<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta
            name="description"
            content="Sistema interno do Ponto da Moda para gestão de estoque. Conferência de mercadorias, circulares, registro de reposições e impressão de descrições detalhadas para otimizar a operação diária."
        />
        <link rel="stylesheet" href="css/style.css" />
        <script
            type="module"
            src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"
        ></script>
        <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
        <script denfer src="js/load-components.js"></script>
        <script defer src="js/btn-mobile.js"></script>
        <title>Ponto da Moda - Estoque</title>
    </head>
    <body>
        <header id="header" class="header"></header>
        <div class="main-container">
            <aside id="sidebar" class="sidebar"></aside>
            <main class="main codigo-mil">
                <div class="form-container">
                <h1 class="heading-primary">Código Mil</h1>

                    <h2 class="heading-secondary">Adicione os dados abaixo:</h2>
                    <form class="form form--extract-reference">
                        <div class="form__group">
                            <textarea
                                id="csvInput"
                                placeholder='Cole aqui seus dados CSV:'
                            ></textarea>
                        </div>
                        <button class="btn btn--submit">Processar Dados</button>
                    </form>
                </div>
                <div class="container-links">
                    <a href="#">cm</a>
                    <a href="#">cf</a>
                    <a href="#">ci</a>
                    <a href="#">la</a>
                    <a href="#">va</a>
                </div>
            </main>
        </div>
    </body>
</html>
