<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta
            name="description"
            content="Sistema interno do Ponto da Moda para gestão de estoque. Consulte produtos, registre reposições e acesse descrições detalhadas para otimizar a operação diária."
        />
        <link rel="stylesheet" href="css/style.css" />
        <script
            type="module"
            src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"
        ></script>
        <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
        <script defer src="js/btn-mobile.js"></script>
        <title>Ponto da Moda - Estoque</title>
    </head>
    <body>
        <header class="header">
            <div class="header__container container">
                <a
                    class="header__logo-link"
                    href="index.html"
                    aria-label="Página inicial - Ponto da Moda"
                >
                    <img
                        class="header__logo-img"
                        src="assets/img/logo-pdm-estoque.svg"
                        alt="Logotipo do Ponto da Moda Estoque"
                    />
                </a>

                <form class="search-form" role="search">
                    <label for="search-input" class="sr-only">Buscar produto</label>
                    <input
                        id="search-input"
                        name="search"
                        class="search-form__input"
                        type="text"
                        placeholder="Consultar produto"
                        autocomplete="off"
                        required
                    />
                    <button type="submit" class="search-form__button" aria-label="Buscar">
                        <ion-icon class="search-form__icon" name="search-outline"></ion-icon>
                    </button>
                </form>

                <nav class="navbar">
                    <ul class="navbar__list">
                        <li class="navbar__item">
                            <a class="navbar__link" href="#">Reposição</a>
                        </li>

                        <li class="navbar__item submenu">
                            <button class="submenu__button">
                                <span>Descrição</span>
                                <ion-icon class="submenu__icon" name="chevron-down-outline"></ion-icon>
                                <ion-icon class="submenu__icon" name="chevron-up-outline"></ion-icon>
                            </button>

                            <ul class="submenu__list">
                                <li class="submenu__item">
                                    <a class="submenu__link" href="descricao-produto.html"
                                        >Descrição de Produto</a
                                    >
                                </li>

                                <li class="submenu__item">
                                    <a class="submenu__link" href="descricao-transferencia.html"
                                        >Descrição de Transferência</a
                                    >
                                </li>
                            </ul>
                        </li>

                        <li class="navbar__item">
                            <a class="navbar__link" href="circular.html">Circular</a>
                        </li>
                    </ul>
                    <a class="btn btn__link btn--sign-in" href="login.html">Entrar</a>
                </nav>

                <button class="navbar__button-mobile">
                    <ion-icon class="icon" name="menu-outline"></ion-icon>
                    <ion-icon class="icon" name="close-outline"></ion-icon>
                </button>
            </div>
        </header>
    </body>
</html>
