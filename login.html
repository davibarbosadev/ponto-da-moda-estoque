<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="../css/style.css" />
        <title>Login</title>
    </head>
    <body class="login">
        <img
            class="logo-img"
            src="../assets/img/logo-pdm-estoque.svg"
            alt="logo ponto da moda"
        />
        <div class="form-container">
            <h1 class="heading-primary">Login</h1>
            <form class="form-login form">
                <label for="email">
                    <span class="label-name">Email</span>
                    <input class="input" type="email" id="email" />
                </label>
                <label for="password">
                    <span class="label-name">Senha</span>
                    <input class="input" type="password" id="password" />
                </label>
                <a class="forgot-password" href="#">Esqueceu a senha?</a>
                <input class="submit" type="submit" value="Entrar" />
            </form>
        </div>
    </body>
</html>
