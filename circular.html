<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0" />
            <link rel="icon" href="assets/img/favicon-pdm.ico" />

            <link rel="stylesheet" href="../css/style.css" />
            <script
                type="module"
                src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"
            ></script>
            <script
                nomodule
                src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"
            ></script>
            <script src="./js/auth.js"></script>
            <script defer src="./js/btnMobile.js"></script>
            <script defer src="./js/loadComponents.js"></script>
            <script defer src="./js/circular.js"></script>
            <title>Ponto da Moda - Estoque</title>
        </head>
    </head>
    <body>
        <header id="header" class="header"></header>

        <div class="main-container">
            <aside id="sidebar" class="sidebar"></aside>

            <main class="main">
                <div class="form-container">
                    <h2 class="heading-primary">Formatar Circular</h2>

                    <p class="copied-notice">copiado para a área de transferêcia!</p>

                    <form class="form form--circular">
                        <div class="form__group">
                            <label class="form__label" for="text">Referência</label>
                            <input class="form__input" type="text" id="text" required />
                        </div>
                        <button class="btn btn--submit">Formatar e Copiar</button>
                    </form>
                </div>
            </main>
        </div>
    </body>
</html>
