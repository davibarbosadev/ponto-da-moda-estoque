<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0" />
            <link rel="stylesheet" href="../css/style.css" />
            <script
                type="module"
                src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"
            ></script>
            <script
                nomodule
                src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"
            ></script>
            <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
            <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
            <script defer src="js/btn-mobile.js"></script>
            <script defer src="js/description-product.js"></script>
            <title>Ponto da Moda - Estoque</title>
        </head>
    </head>
    <body>
        <header class="header">
            <div class="header__container container">
                <a
                    class="header__logo-link"
                    href="index.html"
                    aria-label="Página inicial - Ponto da Moda"
                >
                    <img
                        class="header__logo-img"
                        src="assets/img/logo-pdm-estoque.svg"
                        alt="Logotipo do Ponto da Moda Estoque"
                    />
                </a>

                <form class="search-form" role="search">
                    <label for="search-input" class="sr-only">Buscar produto</label>
                    <input
                        id="search-input"
                        name="search"
                        class="search-form__input"
                        type="text"
                        placeholder="Consultar produto"
                        autocomplete="off"
                        required
                    />
                    <button type="submit" class="search-form__button" aria-label="Buscar">
                        <ion-icon class="search-form__icon" name="search-outline"></ion-icon>
                    </button>
                </form>

                <nav class="navbar">
                    <ul class="navbar__list">
                        <li class="navbar__item">
                            <a class="navbar__link" href="#">Reposição</a>
                        </li>

                        <li class="navbar__item submenu">
                            <button class="submenu__button">
                                <span>Descrição</span>
                                <ion-icon
                                    class="submenu__icon"
                                    name="chevron-down-outline"
                                ></ion-icon>
                                <ion-icon
                                    class="submenu__icon"
                                    name="chevron-up-outline"
                                ></ion-icon>
                            </button>

                            <ul class="submenu__list">
                                <li class="submenu__item">
                                    <a class="submenu__link" href="descricao-produto.html"
                                        >Descrição de Produto</a
                                    >
                                </li>

                                <li class="submenu__item">
                                    <a class="submenu__link" href="descricao-transferencia.html"
                                        >Descrição de Transferência</a
                                    >
                                </li>
                            </ul>
                        </li>

                        <li class="navbar__item">
                            <a class="navbar__link" href="circular.html">Circular</a>
                        </li>
                    </ul>
                    <a class="btn btn__link btn--sign-in" href="login.html">Entrar</a>
                </nav>

                <button class="navbar__button-mobile">
                    <ion-icon class="icon" name="menu-outline"></ion-icon>
                    <ion-icon class="icon" name="close-outline"></ion-icon>
                </button>
            </div>
        </header>

        <main class="container">
            <h2 class="heading-primary">Descrição de Produto</h2>

            <form class="form form--description-product">
                <div class="form__group">
                    <label for="description" class="form__label">Descrição</label>
                    <input class="form__input" type="text" id="description" required />
                </div>

                <div class="form__group">
                    <label for="reference" class="form__label">Referência</label>
                    <input class="form__input" type="text" id="reference" required />
                </div>

                <div class="form__group">
                    <label for="price" class="form__label">Preço</label>
                    <input class="form__input" type="number" id="price" step="any" required />
                </div>

                <div class="form__controls">
                    <button class="btn btn--submit" type="submit">Adicionar</button>
                    <button class="btn btn--clean" type="button">Limpar Tudo</button>
                    <button class="btn btn--print" type="button">
                        <ion-icon class="form__icon" name="print-outline"></ion-icon>
                        <span>Imprimir</span>
                    </button>
                </div>
            </form>

            <div class="description-list">
                
            </div>
            <iframe id="iframeContent" style="display: none; width: 0; height: 0"></iframe>
        </main>
    </body>
</html>
