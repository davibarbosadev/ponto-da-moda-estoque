<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0" />
            <link rel="stylesheet" href="../css/style.css" />
            <script
                type="module"
                src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"
            ></script>
            <script
                nomodule
                src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"
            ></script>
            <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
            <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
            <script src="js/loadComponents.js"></script>
            <script defer src="js/btnMobile.js"></script>
            <script defer src="js/descriptionProduct.js"></script>
            <title>Ponto da Moda - Estoque</title>
        </head>
    </head>
    <body>
        <header id="header" class="header"></header>
        <div class="main-container">
            <aside id="sidebar" class="sidebar"></aside>

            <main class="main">
                <div class="form-container">
                    <h2 class="heading-primary">Descrição de Produto</h2>

                    <form class="form form--description-product">
                        <div class="form__group">
                            <label for="description" class="form__label">Descrição</label>
                            <input class="form__input" type="text" id="description" required />
                        </div>

                        <div class="form__group">
                            <label for="reference" class="form__label">Referência</label>
                            <input class="form__input" type="text" id="reference" required />
                        </div>

                        <div class="form__group">
                            <label for="fashionStyle" class="form__label">Estilo/Seção</label>
                            <input class="form__input" type="text" id="fashionStyle" required />
                        </div>
                        
                        <div class="form__group">
                            <label for="sizes" class="form__label">Grade</label>
                            <input class="form__input" type="text" id="sizes" required />
                        </div>
                        
                        <div class="form__group">
                            <label for="price" class="form__label">Preço</label>
                            <input
                                class="form__input"
                                type="number"
                                id="price"
                                step="any"
                                required
                            />
                        </div>


                        <div class="form__group">
                            <label for="colors" class="form__label">Cores</label>
                            <input class="form__input" type="text" id="colors" required />
                        </div>

                        <div class="form__controls">
                            <button class="btn btn--submit" type="submit">Adicionar</button>

                            <button class="btn btn--clean" type="button">Limpar Tudo</button>

                            <button class="btn btn--print" type="button">
                                <ion-icon class="form__icon" name="print-outline"></ion-icon>
                                <span>Imprimir</span>
                            </button>
                        </div>
                    </form>
                </div>

                <div class="description-list"></div>
                <iframe id="iframeContent" style="display: none; width: 0; height: 0"></iframe>
            </main>
        </div>
    </body>
</html>
