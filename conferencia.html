<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="icon" href="assets/img/favicon-pdm.ico" />

        <link
            rel="stylesheet"
            type="text/css"
            href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css"
        />
        <link
            rel="stylesheet"
            type="text/css"
            href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css"
        />
        <link rel="stylesheet" href="css/style.css" />
        <script
            type="module"
            src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"
        ></script>
        <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
        <script defer src="./js/loadComponents.js"></script>
        <script defer src="./js/btnMobile.js"></script>
        <script defer src="./js/conferencia.js"></script>
        <title>Ponto da Moda - Estoque</title>
    </head>
    <body>
        <header id="header" class="header"></header>
        <div class="main-container">
            <aside id="sidebar" class="sidebar"></aside>
            <main class="main">
                <div class="summary">
                    <div class="summary__header">
                        <div class="summary__title">
                            <i class="ph ph-cube icon"></i>
                            Código Mil
                        </div>

                        <div class="summary__store">
                            <i class="ph ph-storefront icon"></i>
                            <span class="summary__store-info" id="store-info"></span>
                        </div>
                    </div>

                    <p class="summary__subtitle">Conferencia de produtos</p>

                    <div class="progress-bar__container">
                        <h2 class="progress-bar__title">Progresso</h2>
                        <div class="progress-bar__line">
                            <div id="progress-bar" class="progress-bar"></div>
                        </div>
                        <div class="progress-bar__info-text">
                            <span id="progress-text"></span>
                        </div>
                    </div>

                    <div class="filter">
                        <input
                            type="text"
                            id="filter-input"
                            class="filter__input"
                            placeholder="Buscar por referência ou descrição..."
                        />
                    </div>
                </div>
                <div id="products-list" class="products-list"></div>
            </main>
        </div>
    </body>
</html>
