<!doctype html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Ponto da Moda - Estoque</title>

        <link rel="icon" href="assets/img/favicon-pdm.ico" />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

        <link
            href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
            rel="stylesheet"
        />

        <script type="module" src="admin.js"></script>
        <script type="module" src="../js/extractReference.js"></script>
        <script type="module" src="../js/formateProduct.js"></script>
    </head>
    <body>
        <div class="view-container">
            <h2 class="heading-secondary">🎯 Painel Admin - Descrição de produtos</h2>
            <main class="main">
                <div class="form-container">
                    <div class="message-display">mensagem</div>

                    <h3 class="heading-tertiary">Passo 1 - Extrair Referência</h3>

                    <form class="form form--extract-reference">
                        <div class="form__group">
                            <label for="description" class="form__label">Dados csv</label>

                            <textarea
                                id="csvInput"
                                placeholder='Cole aqui seus   dados CSV no formato:
"ES07";"CF000480MISCL1M - PRODUTO..."'
                            ></textarea>
                        </div>

                        <div class="form__actions">
                            <button type="submit" class="btn btn--solid">
                                Extrair referências
                            </button>
                        </div>
                    </form>

                    <h3 class="heading-tertiary">Passo 2 - Gerar Descrição</h3>

                    <form class="form form--formate-product-description">
                        <div class="form__group">
                            <label for="csvInput" class="form__label">Dados csv</label>

                            <textarea
                                id="csvInput"
                                placeholder='Cole aqui seus dados CSV  no formato:
"referência - descrição";"preço"
"CF000480MISCL1G - DESCRIÇÃO DO PRODUTO";"79,99"'
                            ></textarea>
                        </div>

                        <div class="form__actions">
                            <button type="submit" class="btn btn--solid">
                                Cadastrar descrição
                            </button>
                        </div>
                    </form>
                </div>
            </main>
        </div>
    </body>
</html>
